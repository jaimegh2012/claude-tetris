<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="title-bar">
    <h1 id="game-title">TETRIS</h1>
    <button id="theme-toggle" type="button" aria-label="Cambiar a modo claro/oscuro" title="Cambiar a modo claro/oscuro">🌙</button>
  </div>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-records-section" class="hidden">
          <div id="gameover-name-entry" class="hidden">
            <input id="player-name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="save-record-btn" type="button">Guardar</button>
          </div>
          <div class="records-summary">
            <span>Combo máx: <strong id="gameover-best-combo">0</strong></span>
            <span>Líneas máx: <strong id="gameover-max-lines">0</strong></span>
          </div>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th></tr>
            </thead>
            <tbody id="gameover-records-body"></tbody>
          </table>
          <button id="reset-records-btn-gameover" type="button" class="reset-records-btn">Resetear records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <h2 id="start-title">TETRIS</h2>
        <div class="records-summary">
          <span>Combo máx: <strong id="start-best-combo">0</strong></span>
          <span>Líneas máx: <strong id="start-max-lines">0</strong></span>
        </div>
        <table class="records-table">
          <thead>
            <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th></tr>
          </thead>
          <tbody id="start-records-body"></tbody>
        </table>
        <div class="start-actions">
          <button id="play-btn" type="button">Jugar</button>
          <button id="reset-records-btn-start" type="button" class="reset-records-btn">Resetear records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js?v=7"></script>
</body>
</html>
